# 구역 · 마커 · 목표 좌표 (단위: m, rad) — 지도 maps/map_test1.yaml 용
#
# ⚠ 임시 값 (2026-10-26): 지도 그림만 보고 빈 공간 모서리에 대략 배치했다.
#   실제 대기 · 검사대 · 양품 · 불량 위치와 Nav2 목표 좌표(goal)를 팀에서 받으면 이 값을 고친다.
#   (지도 범위: 방 안쪽 대략 x -0.4 ~ 3.8 m, y -0.4 ~ 2.3 m. 왼쪽 위에 사각 장애물, 오른쪽에 칸막이 두 개)
#
# 좌표는 지도(map) 기준. goal 은 FMS가 /fms/goal_pose 로 보내는 값과 같다 (마커 앞 20~30 cm, 마커를 바라보는 방향).
#   marker     아루코 마커 번호 (화면에는 "마커 N")
#   kind       wait | station | ok | ng | plan  (색 구분)
#   rect       구역 사각형 [x_min, y_min, x_max, y_max]
#   marker_at  마커 위치 [x, y],  marker_side: 붙어 있는 벽 (top | bottom | left | right)  — 모르면 생략
#   goal       목표 자세 [x, y, yaw]

zones:
  - marker: 0
    name: 대기
    sub: 주차 · 복귀 위치
    kind: wait
    rect: [-0.30, -0.30, 0.40, 0.35]
    goal: [0.05, 0.02, 3.14]

  - marker: 1
    name: 검사대
    sub: 적재 위치
    kind: station
    rect: [-0.30, 1.90, 0.60, 2.25]
    goal: [0.15, 2.05, 1.57]

  - marker: 2
    name: 양품
    kind: ok
    rect: [2.90, 1.65, 3.65, 2.25]
    goal: [3.25, 1.95, 0.0]

  - marker: 3
    name: 불량
    kind: ng
    rect: [2.90, 0.72, 3.65, 1.38]
    goal: [3.25, 1.05, 0.0]

# 지도 위에 이름만 덧붙일 것 (맵핑 지도에는 이름이 없으므로)
labels:
  - text: 장애물
    at: [0.60, 1.40]

# 시안용 가짜 경로: 검사대 → 불량 구역 (사각 장애물 위쪽으로 돌아 칸막이 사이로 들어감).
# 실제 로봇과 연결하면 쓰지 않는다.
demo_plan: [[0.15, 2.05], [1.40, 2.05], [1.40, 1.05], [3.25, 1.05]]
